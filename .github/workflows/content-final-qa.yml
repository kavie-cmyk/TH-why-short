name: One-shot TH-why-short final content QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-final-qa.yml'

permissions:
  contents: write

jobs:
  final-content-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final content corrections and content gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new)
              print(label, n)

          # 1) Avoid visual arithmetic between unlike units in problem cards.
          once(
              '<div class="metric">858 + ~700</div>',
              '<div class="metric-pair"><div><strong>858</strong><span>di tích được xếp hạng</span></div><div><strong>~700</strong><span>sản phẩm OCOP</span></div></div>',
              'issue-3-metrics')

          once(
              '<div class="metric">IOC + 71</div>',
              '<div class="metric-pair"><div><strong>IOC</strong><span>đã vận hành</span></div><div><strong>71</strong><span>khu, điểm đã số hóa</span></div></div>',
              'issue-5-metrics')

          # 2) Finance terminology: total tourism receipts, not project revenue.
          once(
              '<div class="sc"><div class="label">Doanh thu du lịch tăng thêm</div><div class="val">1.800–3.000 tỷ/năm</div><p>Kịch bản doanh thu du lịch tăng thêm</p></div>',
              '<div class="sc"><div class="label">Mức tăng tổng thu du lịch dự kiến</div><div class="val">1.800–3.000 tỷ/năm</div><p>Theo kịch bản quy mô thị trường năm 2030; không phải doanh thu hay dòng tiền của Đề án.</p></div>',
              'tourism-receipts')

          once(
              '<div class="sc"><div class="label">Lợi ích định lượng ước tính</div><div class="val">500–800 tỷ/năm</div><p>Giai đoạn 2028–2030</p></div>',
              '<div class="sc"><div class="label">Lợi ích kinh tế có thể lượng hóa</div><div class="val">500–800 tỷ/năm</div><p>Phần đóng góp tăng thêm vào giá trị gia tăng ngành trong giai đoạn 2028–2030; chưa gồm hiệu ứng lan tỏa.</p></div>',
              'quantified-economic-benefit')

          once(
              '<div class="sc"><div class="label">Thu ngân sách tăng thêm</div><div class="val">90–210 tỷ/năm</div><p>Kịch bản thu ngân sách tăng thêm</p></div>',
              '<div class="sc"><div class="label">Thu ngân sách tăng thêm</div><div class="val">90–210 tỷ/năm</div><p>Từ năm 2030, theo giả định tỷ lệ động viên ngân sách khoảng 5–7% tổng thu.</p></div>',
              'budget-revenue-assumption')

          once(
              '<div class="caution"><b>Các kịch bản không được cộng cơ học:</b> Doanh thu du lịch tăng thêm 1.800–3.000 tỷ đồng/năm và lớp lợi ích định lượng 500–800 tỷ đồng/năm phản ánh các nhóm giá trị khác nhau và không cộng trực tiếp nếu chưa chứng minh phạm vi lợi ích là độc lập, không trùng lặp. B/C &gt; 2 và thời gian hoàn vốn kinh tế 4–5 năm là kịch bản sơ bộ, cần được xác định lại khi có đầy đủ dữ liệu đầu vào.</div>',
              '<div class="caution"><b>Các nhóm lợi ích được tính riêng:</b> Mức tăng tổng thu du lịch 1.800–3.000 tỷ đồng/năm phản ánh phần tổng thu của ngành có thể tăng theo kịch bản phát triển du lịch; lợi ích kinh tế có thể lượng hóa 500–800 tỷ đồng/năm là lớp giá trị dùng riêng cho tính toán hiệu quả tổng hợp. Hai nhóm không cộng trực tiếp để tránh trùng lặp. Mức tăng tổng thu du lịch không phải lợi nhuận của Đề án hoặc dòng tiền hoàn vốn. B/C &gt; 2 và thời gian hoàn vốn kinh tế 4–5 năm là kịch bản sơ bộ và sẽ được hoàn thiện khi đủ dữ liệu chi phí, tiến độ và dòng lợi ích.</div>',
              'finance-boundary')

          # 3) Add an explicit output layer between investment items and expected benefits.
          journey_marker = '''</div>\n</div>\n</div>\n</section>\n<section class="section white">\n<div class="wrap">\n<div class="head"><div class="section-no">07 · Hành trình phục vụ du khách</div>'''
          outputs = '''</div>\n</div>\n</div>\n</section>\n<section class="section outputs-section">\n<div class="wrap">\n<div class="head"><div class="section-no">Đầu ra đến năm 2030</div><div><h2>Những năng lực và mức bao phủ dự kiến sau đầu tư</h2><p class="dek">Các chỉ tiêu đầu ra được xác định ở quy mô toàn tỉnh và phản ánh năng lực mà bảy hạng mục cùng hình thành, không phải KPI riêng của một hạng mục nếu chức năng có tính liên thông.</p></div></div>\n<div class="outputs-grid">\n<div class="output-kpi"><strong>08</strong><span>khu, điểm du lịch trọng điểm được đầu tư hạ tầng số theo phương án đầu tư</span></div>\n<div class="output-kpi"><strong>≥10</strong><span>khu, điểm kết nối dữ liệu và giám sát với IOC du lịch</span></div>\n<div class="output-kpi"><strong>100%</strong><span>dữ liệu tài nguyên du lịch được số hóa theo phạm vi Đề án đến năm 2030</span></div>\n<div class="output-kpi"><strong>≥20</strong><span>sản phẩm trải nghiệm số di sản, sinh thái, văn hóa</span></div>\n<div class="output-kpi"><strong>1.200–1.500</strong><span>doanh nghiệp, cơ sở lưu trú và hộ kinh doanh tham gia hệ sinh thái số</span></div>\n<div class="output-kpi"><strong>2,5–3,0 triệu</strong><span>người dùng Ứng dụng Thanh Hóa Smart Tourism vào năm 2030</span></div>\n<div class="output-kpi"><strong>&gt;90%</strong><span>cơ sở kinh doanh dịch vụ du lịch tham gia nền tảng; mức hài lòng của du khách mục tiêu trên 90%</span></div>\n</div>\n</div>\n</section>\n<section class="section white">\n<div class="wrap">\n<div class="head"><div class="section-no">07 · Hành trình phục vụ du khách</div>'''
          once(journey_marker, outputs, 'outputs-section')

          # 4) Minimal UI support for the corrected content.
          once(
              '.issue .metric{font-size:32px;font-weight:700;color:var(--navy);line-height:1.05}.issue .desc{font-size:13px;color:var(--muted);margin-top:10px}',
              '.issue .metric{font-size:32px;font-weight:700;color:var(--navy);line-height:1.05}.metric-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 2px}.metric-pair>div{padding:8px 9px;border-radius:12px;background:#f4f9fb;border:1px solid #e1edf1}.metric-pair strong{display:block;font-size:24px;line-height:1;color:var(--navy)}.metric-pair span{display:block;margin-top:5px;font-size:10.5px;line-height:1.25;color:var(--muted)}.issue .desc{font-size:13px;color:var(--muted);margin-top:10px}',
              'metric-pair-css')

          css_anchor = '.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}'
          css_new = '.outputs-section{background:linear-gradient(180deg,#eef8fa,#f7fbfc)}.outputs-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.output-kpi{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 26px rgba(7,57,90,.06)}.output-kpi strong{display:block;font-size:27px;line-height:1;color:var(--navy)}.output-kpi span{display:block;margin-top:8px;font-size:11.5px;line-height:1.4;color:var(--muted)}\n'+css_anchor
          once(css_anchor, css_new, 'outputs-css')

          once(
              '@media(max-width:1050px){.hero-kpis{grid-template-columns:repeat(2,1fr)}',
              '@media(max-width:1050px){.outputs-grid{grid-template-columns:repeat(2,1fr)}.hero-kpis{grid-template-columns:repeat(2,1fr)}',
              'outputs-responsive-tablet')
          once(
              '@media(max-width:680px){.wrap,.topbar .inner{padding-left:16px;padding-right:16px}',
              '@media(max-width:680px){.outputs-grid{grid-template-columns:1fr}.wrap,.topbar .inner{padding-left:16px;padding-right:16px}',
              'outputs-responsive-mobile')

          # Final content gate: required facts and forbidden residuals.
          required = [
              'Mức tăng tổng thu du lịch dự kiến',
              'không phải doanh thu hay dòng tiền của Đề án',
              'Lợi ích kinh tế có thể lượng hóa',
              'đóng góp tăng thêm vào giá trị gia tăng ngành',
              'chưa gồm hiệu ứng lan tỏa',
              'tỷ lệ động viên ngân sách khoảng 5–7% tổng thu',
              'Mức tăng tổng thu du lịch không phải lợi nhuận của Đề án hoặc dòng tiền hoàn vốn',
              '08</strong><span>khu, điểm du lịch trọng điểm được đầu tư hạ tầng số',
              '≥10</strong><span>khu, điểm kết nối dữ liệu và giám sát với IOC du lịch',
              '100%</strong><span>dữ liệu tài nguyên du lịch được số hóa',
              '≥20</strong><span>sản phẩm trải nghiệm số',
              '1.200–1.500</strong><span>doanh nghiệp, cơ sở lưu trú và hộ kinh doanh tham gia hệ sinh thái số',
              '2,5–3,0 triệu</strong><span>người dùng Ứng dụng Thanh Hóa Smart Tourism',
              '&gt;90%</strong><span>cơ sở kinh doanh dịch vụ du lịch tham gia nền tảng',
              '858</strong><span>di tích được xếp hạng',
              '~700</strong><span>sản phẩm OCOP',
              'IOC</strong><span>đã vận hành',
              '71</strong><span>khu, điểm đã số hóa'
          ]
          for x in required:
              if x not in s:
                  raise SystemExit('missing required corrected content: ' + x)

          forbidden = [
              '<div class="metric">858 + ~700</div>',
              '<div class="metric">IOC + 71</div>',
              '<div class="label">Doanh thu du lịch tăng thêm</div>',
              '<div class="label">Lợi ích định lượng ước tính</div>',
              '<p>Kịch bản thu ngân sách tăng thêm</p>',
              'Doanh thu du lịch tăng thêm 1.800–3.000 tỷ đồng/năm',
              '35–55 tỷ/năm',
              '15–25 + 20–30 tỷ đồng/năm'
          ]
          bad = [x for x in forbidden if x in s]
          if bad:
              raise SystemExit('content QA residuals: ' + repr(bad))

          p.write_text(s, encoding='utf-8')
          print('FINAL_CONTENT_QA_PASS')
          PY

      - name: Commit final content and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "ChatGPT Content QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/content-final-qa.yml
          git add index.html .github/workflows/content-final-qa.yml
          git commit -m "Finalize TH-why-short content QA"
          git push
